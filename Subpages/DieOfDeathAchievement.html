            <script>
                //Mute button + animation
                const music = document.getElementById("main-theme");
                const button = document.getElementById("harken");
                const icon = document.getElementById("harken-icon");

                const harkenPause = "../MusicMute/HarkenAudioSettingIconStill1.png";
                const harkenPlay = "../MusicMute/HarkenAudioSettingIconStill4.png";

                const framesPause = [
                    "../MusicMute/HarkenAudioSettingIconStill4.png",
                    "../MusicMute/HarkenAudioSettingIconStill3.png",
                    "../MusicMute/HarkenAudioSettingIconStill2.png",
                    "../MusicMute/HarkenAudioSettingIconStill1.png"
                ];

                const framesPlay = [
                    "../MusicMute/HarkenAudioSettingIconStill1.png",
                    "../MusicMute/HarkenAudioSettingIconStill2.png",
                    "../MusicMute/HarkenAudioSettingIconStill3.png",
                    "../MusicMute/HarkenAudioSettingIconStill4.png"
                ];

                const frameTime = 85; //reminder it's per ms

                let animPlaying = false;

                function playAnim(frames, callback) {
                    animPlaying = true;
                    let i = 0;

                    function showNextFrame() {
                        icon.src = frames[i];
                        i++;
                        if (i < frames.length) {
                            setTimeout(showNextFrame, frameTime);
                        } else {
                            animPlaying = false;
                            if (callback) callback();
                        }
                    }

                    showNextFrame();
                }

                function togglemusic() {
                    if (animPlaying) return;

                    if (music.paused) {
                        music.play();
                        playAnim(framesPlay);
                    } else {
                        music.pause();
                        playAnim(framesPause);
                    }
                }

                button.addEventListener("click", togglemusic);

                //Achievement Category
                document.addEventListener('DOMContentLoaded', function () {
                    // Categories
                    const buttons = document.querySelectorAll('.achievement-btn');
                    const categories = document.querySelectorAll('.achievement-category');

                    buttons.forEach(button => {
                        button.addEventListener('click', function () {
                            buttons.forEach(btn => btn.classList.remove('active'));
                            this.classList.add('active');

                            const category = this.getAttribute('data-category');
                            categories.forEach(cat => cat.classList.remove('active'));

                            const targetCategory = document.getElementById(category);
                            if (targetCategory) {
                                targetCategory.classList.add('active');
                            }
                        });
                    });

                    const languageSelect = document.getElementById('language-select');

                    // 
                    function loadLanguage(lang) {
                        fetch(`AchievementJSON/${lang}.json`)
                            .then(response => response.json())
                            .then(data => {
                                updateAchievements(data.achievements);
                            })
                            .catch(error => console.error('Something went wrong cuh', error));
                    }

                    loadLanguage(languageSelect.value);

                    languageSelect.addEventListener('change', function () {
                        loadLanguage(this.value);
                    });

                    function updateAchievements(achievements) {
                        //fills in automatically for each class according to the json
                        achievements.forEach(achievement => {
                            const element = document.querySelector(`[data-achievement-id="${achievement.id}"]`);
                            if (element) {
                                const title = element.querySelector('.title');
                                const description = element.querySelector('.description');
                                const quote = element.querySelector('.quote');

                                if (title) title.textContent = achievement.title;
                                if (description) description.textContent = achievement.description;
                                if (quote) quote.textContent = achievement.quote;
                            }
                        });
                    }
                });
            </script>
</body>

</html>
