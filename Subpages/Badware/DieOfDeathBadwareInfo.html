<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Die of French</title>
    <link rel="stylesheet" href="BadwareInfo.css" />

</head>

<body>
    <audio id="main-theme" src="../../Music/DieOfDeathShopTheme.ogg" autoplay loop></audio>

    <div class="music-mute">
        <button id="harken">
            <img src="../../MusicMute/HarkenAudioSettingIconStill1.png" id="harken-icon">
        </button>
    </div>

    <div class="language-selector" style='position: fixed;'>
        <select id="language-select">
            <option value="fr" selected>Français</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="TextBoxSHOP">
        <div class="Text">
            <p>INFORMATION</p>
        </div>
    </div>

    <div class="TextBox">
        <div class="InfoBox" data-killer-id="badware">
            <p class="name"></p>
            <div class="desc">
                <p class="description"></p>
                <p class="descriptiontext"></p>
            </div>
            <div class="stat">
                <p class="stats"></p>
                <p class="stamina"></p>
                <p class="walkspeed"></p>
                <p class="sprintspeed"></p>
                <p class="health"></p>
                <p class="playstyle"></p>
            </div>
            <div class="Achievement">
                <div class="passives">
                    <p class="passive"></p>
                    <p class="passivesmall"></p>
                </div>
            </div>

            <div class="ability">
                <p class="abilities"></p>

                <div class="Abilities">
                    <img src="../../Killers/Badware/Abilities/Badware_swing.webp">
                    <div class="abilities-text">
                        <p class="swing"></p>
                        <p class="swingquote"></p>
                        <p class="swingdesc"></p>
                    </div>
                </div>

                <div class="Abilities">
                    <img src="../../Killers/Badware/Abilities/BadwareFirewallbypass.webp">
                    <div class="abilities-text">
                        <p class="firewall"></p>
                        <p class="firewallquote"></p>
                        <p class="firewalldesc"></p>
                    </div>
                </div>

                <div class="Abilities">
                    <img src="../../Killers/Badware/Abilities/BadwareBolt.webp">
                    <div class="abilities-text">
                        <p class="bolt"></p>
                        <p class="boltquote"></p>
                        <p class="boltdesc"></p>
                    </div>
                </div>

                <div class="Abilities">
                        <img src="../../Killers/Badware/Abilities/BadwareRiftIcon.webp">
                    <div class="abilities-text">
                        <p class="rift"></p>
                        <p class="riftquote"></p>
                        <p class="riftdesc"></p>
                    </div>
                </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <button class="killer-btn" onclick="location.href='../Subpages/DieOfDeathKillerShop.html'"> > Leave</button>


    <script>
        const music = document.getElementById("main-theme");
        const button = document.getElementById("harken");
        const icon = document.getElementById("harken-icon");

        const audio = document.getElementById("main-theme");
        audio.volume = 0.15

        const harkenPause = "../../MusicMute/HarkenAudioSettingIconStill1.png";
        const harkenPlay = "../../MusicMute/HarkenAudioSettingIconStill4.png";

        const framesPause = [
            "../../MusicMute/HarkenAudioSettingIconStill4.png",
            "../../MusicMute/HarkenAudioSettingIconStill3.png",
            "../../MusicMute/HarkenAudioSettingIconStill2.png",
            "../../MusicMute/HarkenAudioSettingIconStill1.png"
        ];

        const framesPlay = [
            "../../MusicMute/HarkenAudioSettingIconStill1.png",
            "../../MusicMute/HarkenAudioSettingIconStill2.png",
            "../../MusicMute/HarkenAudioSettingIconStill3.png",
            "../../MusicMute/HarkenAudioSettingIconStill4.png"
        ];

        var noise = new Audio('../../Music/Shopselect.ogg');
        noise.volume = 0.05;
        noise.playbackRate = 2;

        const frameTime = 85;

        let animPlaying = false;

        function playAnim(frames, callback) {
            animPlaying = true;
            let i = 0;

            function showNextFrame() {
                icon.src = frames[i];
                i++;
                if (i < frames.length) {
                    setTimeout(showNextFrame, frameTime);
                } else {
                    animPlaying = false;
                    if (callback) callback();
                }
            }
            showNextFrame();
        }

        function togglemusic() {
            if (animPlaying) return;

            if (music.paused) {
                music.play();
                playAnim(framesPlay);
                noise.play();
            } else {
                music.pause();
                playAnim(framesPause);
                noise.play();
            }
        }

        button.addEventListener("click", togglemusic);

        const languageSelect = document.getElementById('language-select');

        function loadLanguage(lang) {
            fetch(`../Language/${lang}.json`)
                .then(response => response.json())
                .then(data => {
                    updateKillers(data.killers);
                })
                .catch(error => console.error('Something went wrong cuh', error));
        }

        loadLanguage(languageSelect.value);

        languageSelect.addEventListener('change', function () {
            loadLanguage(this.value);
        });

        function parseFullText(text) {
            if (!text) return '';
            return text
                .replace(/\[c:(\w+)\](.*?)\[\/c\]/g, (match, style, content) => {
                    return `<span class="${style}">${content}</span>`;
                })
                .replace(/\[p:(\w+)\](.*?)\[\/p\]/g, (match, style, content) => {
                    return `<p class="${style}">${content}</p>`;
                })
                .replace(/\[br\]/g, '<br><br>')
                .replace(/\[br1\]/g, '<br>');
        }

        function updateKillers(killers) {
            killers.forEach(killer => {
                const element = document.querySelector(`[data-killer-id="${killer.id}"]`);
                if (element) {
                    const name = element.querySelector('.name');
                    const description = element.querySelector('.description');
                    const descriptiontext = element.querySelector('.descriptiontext');
                    const stats = element.querySelector('.stats');
                    const stamina = element.querySelector('.stamina');
                    const walkspeed = element.querySelector('.walkspeed');
                    const sprintspeed = element.querySelector('.sprintspeed');
                    const health = element.querySelector('.health');
                    const playstyle = element.querySelector('.playstyle');
                    const passive = element.querySelector('.passive');
                    const passivesmall = element.querySelector('.passivesmall');
                    const abilities = element.querySelector('.abilities');
                    const swing = element.querySelector('.swing');
                    const swingquote = element.querySelector('.swingquote');
                    const swingdesc = element.querySelector('.swingdesc');
                    const firewall = element.querySelector('.firewall');
                    const firewallquote = element.querySelector('.firewallquote');
                    const firewalldesc = element.querySelector('.firewalldesc');
                    const bolt = element.querySelector('.bolt');
                    const boltquote = element.querySelector('.boltquote');
                    const boltdesc = element.querySelector('.boltdesc');
                    const rift = element.querySelector('.rift');
                    const riftquote = element.querySelector('.riftquote');
                    const riftdesc = element.querySelector('.riftdesc');

                    if (name) name.innerHTML = parseFullText(killer.name || '');
                    if (description) description.innerHTML = parseFullText(killer.description || '');
                    if (descriptiontext) descriptiontext.innerHTML = parseFullText(killer.descriptiontext || '');
                    if (stats) stats.innerHTML = parseFullText(killer.stats || '');
                    if (stamina) stamina.innerHTML = parseFullText(killer.stamina || '');
                    if (walkspeed) walkspeed.innerHTML = parseFullText(killer.walkspeed || '');
                    if (sprintspeed) sprintspeed.innerHTML = parseFullText(killer.sprintspeed || '');
                    if (health) health.innerHTML = parseFullText(killer.health || '');
                    if (playstyle) playstyle.innerHTML = parseFullText(killer.playstyle || '');
                    if (passive) passive.innerHTML = parseFullText(killer.passive || '');
                    if (passivesmall) passivesmall.innerHTML = parseFullText(killer.passivesmall || '');
                    if (abilities) abilities.innerHTML = parseFullText(killer.abilities || '');
                    if (swing) swing.innerHTML = parseFullText(killer.swing || '');
                    if (swingquote) swingquote.innerHTML = parseFullText(killer.swingquote || '');
                    if (swingdesc) swingdesc.innerHTML = parseFullText(killer.swingdesc || '');
                    if (firewall) firewall.innerHTML = parseFullText(killer.firewall || '');
                    if (firewallquote) firewallquote.innerHTML = parseFullText(killer.firewallquote || '');
                    if (firewalldesc) firewalldesc.innerHTML = parseFullText(killer.firewalldesc || '');
                    if (bolt) bolt.innerHTML = parseFullText(killer.bolt || '');
                    if (boltquote) boltquote.innerHTML = parseFullText(killer.boltquote || '');
                    if (boltdesc) boltdesc.innerHTML = parseFullText(killer.boltdesc || '');
                    if (rift) rift.innerHTML = parseFullText(killer.rift || '');
                    if (riftquote) riftquote.innerHTML = parseFullText(killer.riftquote || '');
                    if (riftdesc) riftdesc.innerHTML = parseFullText(killer.riftdesc || '');

                }
            });
        }
    </script>
</body>

</html>
